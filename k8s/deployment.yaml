apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemeral-api-deployment
  labels:
    app: ephemeral-api
    environment: ephemeral-production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ephemeral-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ephemeral-api
    spec:
      containers:
      - name: ephemeral-api
        image: 049985671225.dkr.ecr.us-east-1.amazonaws.com/ephemeral-api:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

